[project]
name = "phacoguard"
version = "0.1.0"
description = "AI second pair of eyes for complex cataract surgery (research prototype)"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch", "torchvision", "opencv-python-headless", "numpy", "pandas", "scikit-learn", "pyyaml", "fastapi", "uvicorn", "onnxruntime", "tqdm"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
